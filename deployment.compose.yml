# Local single-host control plane. This does not provide production tenant isolation.
# Usage: docker compose --env-file .env.openflows -f deployment.compose.yml up -d
name: openflows
services:
  coder-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:?Set CODER_PG_PASSWORD}
      POSTGRES_DB: coder
    volumes: ["coder_db_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  openflows-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openflows
      POSTGRES_PASSWORD: ${OPENFLOWS_PG_PASSWORD:?Set OPENFLOWS_PG_PASSWORD}
      POSTGRES_DB: openflows_control_plane
    ports: ["127.0.0.1:5544:5432"]
    volumes: ["openflows_db_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]
    restart: unless-stopped
  coder:
    image: ghcr.io/coder/coder:${CODER_IMAGE_TAG:-v2.37.3}
    user: "0:0"
    ports: ["127.0.0.1:7080:7080"]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - 'export CODER_OAUTH2_GITHUB_CLIENT_SECRET="$$(cat /run/secrets/coder_github_secret)"; export CODER_CHAT_HOOK_SECRET="$$(cat /run/secrets/coder_hook_secret)"; exec /opt/coder server'
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:${CODER_PG_PASSWORD:?Set CODER_PG_PASSWORD}@coder-db:5432/coder?sslmode=disable
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:?Set the browser and workspace reachable Coder URL}
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_OAUTH2_GITHUB_CLIENT_ID: ${CODER_OAUTH2_GITHUB_CLIENT_ID:?Set the Coder GitHub client ID}
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "true"
      CODER_OAUTH2_GITHUB_ALLOWED_ORGS: ${CODER_OAUTH2_GITHUB_ALLOWED_ORGS:-}
      CODER_OAUTH2_GITHUB_ALLOW_EVERYONE: ${CODER_OAUTH2_GITHUB_ALLOW_EVERYONE:-false}
      CODER_OAUTH2_PROVIDER_ENABLE: "true"
      # OAuth provider is enabled explicitly; the experiment preserves local compatibility.
      CODER_EXPERIMENTS: ${CODER_EXPERIMENTS:-agent-lifecycle-hooks,oauth2}
      CODER_CHAT_HOOK_URL: ${OPENFLOWS_HOOK_URL:?Set OPENFLOWS_HOOK_URL to the Manager hook endpoint}
      # The hook signing secret is the same durable file the `openflows operator setup`
      # command generates, so a fresh install starts without a separately-defined
      # CODER_CHAT_HOOK_SECRET env var.
      CODER_CHAT_HOOK_SECRET: ${CODER_CHAT_HOOK_SECRET:-}
      CODER_CHAT_HOOK_ENABLED: "true"
      # Local installs reach Manager over plain HTTP; hosted ones must use HTTPS.
      CODER_CHAT_HOOK_ALLOW_INSECURE: ${CODER_CHAT_HOOK_ALLOW_INSECURE:-false}
      CODER_PROVISIONER_DAEMONS: "1"
      # The Manager requests a 90-day admin key and renews it before expiry.
      # Do not extend the default lifetime of interactive user sessions.
      CODER_MAX_ADMIN_TOKEN_LIFETIME: ${CODER_MAX_ADMIN_TOKEN_LIFETIME:-2160h}
      TF_PLUGIN_CACHE_DIR: /root/.terraform.d/plugin-cache
    secrets: [coder_github_secret, coder_hook_secret]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - tf_plugin_cache:/root/.terraform.d/plugin-cache
    # Reach the host Manager for lifecycle hooks (host.docker.internal is a
    # built-in alias on macOS/Windows; Linux Docker requires host-gateway).
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      coder-db:
        condition: service_healthy
    restart: unless-stopped
  # Tenant containers and the Manager share this Compose network.
  runtime-relay:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:7081:8080"]
    volumes:
      - ./deploy/local/runtime-relay.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  # The OpenFlows Manager (control plane), built from this checkout so it always
  # matches the Console. To run a published image instead, set
  # OPENFLOWS_MANAGER_IMAGE (e.g. ghcr.io/the-agenticflow/openflows-manager:X.Y.Z)
  # and start with `up -d --pull always`. Do not run a second Manager on the host.
  # Container-side values below override the host-side ones in .env.openflows, which
  # serves the host-run `cargo run ... serve` flow. One-time setup and checks:
  #   docker compose --env-file .env.openflows -f deployment.compose.yml run --rm manager setup
  #   docker compose --env-file .env.openflows -f deployment.compose.yml run --rm manager doctor
  manager:
    image: ${OPENFLOWS_MANAGER_IMAGE:-openflows-manager:local}
    build:
      context: .
      dockerfile: Dockerfile.manager
    # The secret files are owner-only, so run as the user who owns them.
    user: "${OPENFLOWS_MANAGER_UID:-1000}:${OPENFLOWS_MANAGER_GID:-1000}"
    # Docker provisioner: tenant containers are created through the host socket.
    group_add: ["${DOCKER_GID:-999}"]
    env_file: [.env.openflows]
    environment:
      OPENFLOWS_MANAGER_ADDR: 0.0.0.0:3002
      OPENFLOWS_DATABASE_URL: postgres://openflows:${OPENFLOWS_PG_PASSWORD:?Set OPENFLOWS_PG_PASSWORD}@openflows-db:5432/openflows_control_plane
      OPENFLOWS_REDIS_ADMIN_URL: redis://redis:6379
      REDIS_URL: redis://redis:6379
      # Mounted into tenant provisioner containers by the host Docker daemon, so
      # it must be the same absolute path on the host and in this container.
      OPENFLOWS_PROVISIONER_SECRET_DIR: ${OPENFLOWS_PROVISIONER_SECRET_DIR:-${PWD}/.local/provisioners}
      OPENFLOWS_SECRET_DIR: /run/openflows/secrets
      CODER_URL: http://coder:7080
      # The relay is a sibling container, not a host port.
      OPENFLOWS_RUNTIME_RELAY_BASE_URL: http://runtime-relay:8080/tenants/{tenant}
    ports: ["127.0.0.1:3002:3002"]
    volumes:
      - ${OPENFLOWS_SECRET_DIR:-.openflows/secrets}:/run/openflows/secrets
      # Manager picks up ./.env.openflows from its working directory, which also
      # derives the secret-file references (*_REF) the way the host flow does.
      - ./.env.openflows:/home/openflows/.env.openflows:ro
      - ${OPENFLOWS_PROVISIONER_SECRET_DIR:-${PWD}/.local/provisioners}:${OPENFLOWS_PROVISIONER_SECRET_DIR:-${PWD}/.local/provisioners}
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      openflows-db: {condition: service_started}
      redis: {condition: service_started}
      coder: {condition: service_started}
    healthcheck:
      test: ["CMD", "openflows-manager", "--help"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  # The Console UI, pulled from GHCR. It proxies Manager's /api/v1 and /auth
  # through itself, reading OPENFLOWS_MANAGER_URL at container start. By default
  # it reaches the `manager` service above over the Compose network. For a
  # Manager run on the host instead, set
  # OPENFLOWS_MANAGER_URL=http://host.docker.internal:3002.
  console:
    image: ghcr.io/the-agenticflow/openflows-console:${CONSOLE_IMAGE_TAG:-develop}
    ports: ["127.0.0.1:3000:3000"]
    environment:
      OPENFLOWS_MANAGER_URL: ${OPENFLOWS_MANAGER_URL:-http://manager:3002}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      manager: {condition: service_started}
    restart: unless-stopped
secrets:
  coder_github_secret:
    file: ${OPENFLOWS_SECRET_DIR:-.openflows/secrets}/coder-github-client-secret
  coder_hook_secret:
    file: ${OPENFLOWS_SECRET_DIR:-.openflows/secrets}/coder-hook-secret
volumes:
  coder_db_data:
  openflows_db_data:
  redis_data:
  tf_plugin_cache:
