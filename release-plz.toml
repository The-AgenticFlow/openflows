# release-plz configuration.
#
# Drives the release workflow (`.github/workflows/release.yml`), which runs ONLY
# on pushes to `main` (release-only; `develop` is the default branch):
#   - `release-pr` : scans Conventional Commits since the last tag, computes the
#                    next version, and opens a `release-plz-*` PR to `main` that
#                    bumps the manifest + CHANGELOG.
#   - `release`    : creates the package tag + GitHub Release when the main push
#                    is the merge of a `release-plz-*` PR
#                    (`release_always = false`).
#
# Release flow: only `develop` merges into `main`, which triggers `release-pr`;
# the resulting `release-plz-*` version-bump PR merges back into `main` and
# triggers `release`. The `release-branch.yml` guard enforces this source model.
#
# GitHub integration is via git tags only (`git_only = true`) — the shipped
# package is an application binary that is NOT published to crates.io, so
# release-plz never runs `cargo publish` and never queries the registry.
#
# Only `openflows` is released, as a single GitHub Release + git tag with no `v`
# prefix: `openflows-X.Y.Z`. The other binaries (`openflows-doctor`,
# `openflows-harness`) are built from the same release and bundled into the
# `openflows` tarball; they are not released as separate packages.

[workspace]
# Determine released versions from git tags instead of the crates.io registry.
git_only = true
# Explicitly disable crates.io publishing (no CARGO_REGISTRY_TOKEN is provided).
publish = false
# `openflows` is an application binary, not a published library, and its only
# baseline is its own git tag. Skip cargo-semver-checks so a newer rustc rustdoc
# format (e.g. v60) does not break version determination during release-pr.
semver_check = false
# Only release when the main push is the merge of a `release-plz-*` release PR
# (not on every push), avoiding premature tags before the bump PR merges.
release_always = false
# Only the package explicitly opted in below is processed. The rest of the
# workspace crates are libraries/sub-crates and are intentionally not released.
release = false
# Changelog generation is configured in `cliff.toml` (git-cliff) and written to
# a single repository-root CHANGELOG.md.
changelog_config = "cliff.toml"
changelog_path = "./CHANGELOG.md"

# `openflows` is the single released package. The tag carries no `v` prefix:
# `openflows-{{ version }}`.
[[package]]
name = "openflows"
release = true
git_tag_name = "openflows-{{ version }}"
# Release notes = the grouped changelog (from cliff.toml). Contributor
# attribution is rendered per-change in the changelog by git commit author (see
# the `commit` macro and `commit_preprocessors` in cliff.toml), so every
# contributor is credited regardless of whether the commit subject carried a
# `(#N)` PR trailer. Mentions are rendered from an exact GitHub username when a
# commit is authored with a GitHub noreply email (`NNNNNNN+<login>@users.noreply
# .github.com`) and fall back to the author display name otherwise. We do not
# render a separate Contributors list from `remote.contributors`: that
# release-plz lookup is driven only by `/pull/N` links embedded from `(#N)`
# trailers in commit subjects, so contributors whose commits lack such a trailer
# (e.g. merge-style workflows) would otherwise be silently dropped.
git_release_body = """
{{ changelog }}
"""
