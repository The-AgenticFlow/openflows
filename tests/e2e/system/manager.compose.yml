# Additional services and Coder Terraform env for the workspace-runtime + Manager E2E (#514/#515).
services:
  openflows-db:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: openflows
      POSTGRES_PASSWORD: openflows
      POSTGRES_DB: openflows_control_plane
    ports: ["127.0.0.1::5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openflows -d openflows_control_plane"]
      interval: 2s
      timeout: 3s
      retries: 30

  coder:
    environment:
      CODER_EXPERIMENTS: agent-lifecycle-hooks,oauth2
      CODER_OAUTH2_PROVIDER_ENABLE: "true"
      CODER_MAX_TOKEN_LIFETIME: 2160h
      CODER_MAX_ADMIN_TOKEN_LIFETIME: 2160h
      CODER_DEFAULT_TOKEN_LIFETIME: 2160h
      TF_VAR_dev_binary_host_path: ${TF_VAR_dev_binary_host_path:-}
      TF_VAR_docker_network: ${TF_VAR_docker_network:?required}
      TF_VAR_github_api_base: ${TF_VAR_github_api_base:?required}
      TF_VAR_github_git_base: ${TF_VAR_github_git_base:?required}
      TF_VAR_connected_local: "true"
      TF_VAR_connected_local_broker_secret_host_path: ${TF_VAR_connected_local_broker_secret_host_path:?required}
      TF_VAR_connected_local_helper_host_path: ${TF_VAR_connected_local_helper_host_path:?required}
      TF_VAR_connected_local_manager_url: ${TF_VAR_connected_local_manager_url:?required}
    depends_on:
      openflows-db:
        condition: service_healthy
