[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# RUSTSEC-2023-0071 (Marvin Attack) flags `rsa` 0.9.10, which has no patched
# release (advisory `patched = []`). It is pulled in transitively only by
# `jsonwebtoken`, and this project authenticates lifecycle hooks exclusively
# with HS256 (see crates/agent-nexus/src/hooks/jwt.rs) — RSA signing/verification
# The manager now uses jsonwebtoken's RSA implementation only for signing
# short-lived GitHub App JWTs; it does not use the affected RSA decryption path.
# Revisit if a patched `rsa` or an RSA-less jsonwebtoken becomes available.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
