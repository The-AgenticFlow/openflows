[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# chrono is unmaintained (RUSTSEC-2026-0543) but deeply embedded via sqlx.
# Migration to jiff/time tracked separately.
ignore = ["RUSTSEC-2026-0543"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    # Build-only dependency of kube (ar_archive_writer via psm); permissive.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "ISC",
    "CC0-1.0",
    "Unicode-3.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
