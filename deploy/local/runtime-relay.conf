worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }

http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 2m;
    resolver 127.0.0.11 ipv6=off valid=5s;

    server {
        listen 8080;
        server_tokens off;

        location = /health { return 200 "ok\n"; }

        # The Manager selects the tenant and signs its hook JWT. Only UUID
        # routes are accepted; arbitrary hosts and paths cannot be proxied.
        location ~ "^/tenants/(?<tenant>[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})/experimental/hooks/chat$" {
            limit_except POST { deny all; }
            set $nexus openflows-nexus-$tenant;
            proxy_pass http://$nexus:3001/experimental/hooks/chat;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Content-Type application/json;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_redirect off;
        }

        location / { return 404; }
    }
}
