# Apply after docker-compose.yml only for connected-local development.
# The local Manager brokers Alice's GitHub App user token to her workspaces.
services:
  openflows-db:
    profiles: !reset []

  openflows-local-manager:
    ports:
      - "127.0.0.1:3002:3002"
    build:
      context: .
      dockerfile: Dockerfile.manager
    user: "${OPENFLOWS_LOCAL_UID:?}:${OPENFLOWS_LOCAL_GID:?}"
    group_add:
      - "0"
    environment:
      OPENFLOWS_MODE: local
      OPENFLOWS_RELEASE_NAME: ${OPENFLOWS_RELEASE_NAME:?}
      OPENFLOWS_CONNECTED_LOCAL_ENABLED: "true"
      TF_VAR_connected_local: "true"
      TF_VAR_connected_local_broker_secret_host_path: ${TF_VAR_connected_local_broker_secret_host_path:?}
      TF_VAR_connected_local_helper_host_path: ${TF_VAR_connected_local_helper_host_path:?}
      TF_VAR_connected_local_manager_url: http://openflows-local-manager:3002
      TF_VAR_docker_network: ${COMPOSE_PROJECT_NAME:-openflows}_default
      OPENFLOWS_AUTH_ALLOW_LOOPBACK: "true"
      OPENFLOWS_AUTH_COOKIE_SECURE: "false"
      OPENFLOWS_PUBLIC_URL: http://localhost:3002
      OPENFLOWS_RUNTIME_MANAGER_URL: http://openflows-local-manager:3002
      OPENFLOWS_RUNTIME_REDIS_URL: redis://redis:6379
      OPENFLOWS_REDIS_ADMIN_URL: redis://redis:6379
      OPENFLOWS_HOOK_URL: ${OPENFLOWS_HOOK_URL:-http://host.docker.internal:3002/api/v1/hooks/coder/chat}
      OPENFLOWS_DATABASE_URL: postgres://openflows:${OPENFLOWS_PG_PASSWORD:-openflows}@openflows-db:5432/openflows_control_plane
      OPENFLOWS_SECRET_PROVIDER: filesystem
      OPENFLOWS_SECRET_DIR: /run/openflows-local/secrets
      OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR: ${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}
      OPENFLOWS_PROVISIONER_SECRET_DIR: ${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}/secrets/provisioners
      OPENFLOWS_PROVISIONER_NETWORK: ${COMPOSE_PROJECT_NAME:-openflows}_default
      OPENFLOWS_CODER_HOOK_SECRET_REF: coder-hook-secret
      OPENFLOWS_CODER_OPERATOR_TOKEN_REF: coder-operator-token
      OPENFLOWS_CODER_OAUTH_CLIENT_SECRET_REF: coder-oauth-client-secret
      OPENFLOWS_CODER_OAUTH_CLIENT_ID: ${OPENFLOWS_CODER_OAUTH_CLIENT_ID:-}
      OPENFLOWS_CRYPTO_MASTER_KEY_REF: master-key
      CODER_URL: http://coder:7080
      OPENFLOWS_CODER_PUBLIC_URL: http://localhost:7080
      # Public identifiers for the team App; local contributors need no App secret.
      OPENFLOWS_GITHUB_CLIENT_ID: Iv23liSR6TsW7SxvgRLH
      OPENFLOWS_GITHUB_APP_SLUG: openflows-apps
      OPENFLOWS_CONNECTED_LOCAL_CREDENTIAL_FILE: /run/openflows-local/github-user.json
      TF_VAR_connected_local: "true"
      TF_VAR_connected_local_broker_secret_host_path: ${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}/github-broker-key
      TF_VAR_connected_local_helper_host_path: ${TF_VAR_connected_local_helper_host_path:?}
      TF_VAR_connected_local_manager_url: http://openflows-local-manager:3002
      OPENFLOWS_MANAGER_ADDR: 0.0.0.0:3002
      OPENFLOWS_RUNTIME_RELAY_BASE_URL: http://runtime-relay:8080/tenants/{tenant}
      REDIS_URL: redis://redis:6379
    volumes:
      - ${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}:/run/openflows-local
      - ${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}:${OPENFLOWS_CONNECTED_LOCAL_SECRET_DIR:?}
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - redis
      - openflows-db
    restart: unless-stopped
