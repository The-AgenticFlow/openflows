[workspace]
resolver = "2"
members = [
    "crates/pocketflow-core",
    "crates/github",
    "crates/config",
    "crates/agent-nexus",
    "crates/agent-forge",
    "crates/agent-vessel",
    "crates/agent-sentinel",
    "crates/agent-lore",
    "crates/provisioner",
    "crates/coder-client",
    "crates/openflows-harness",
    "crates/openflows-manager",
    "crates/a2a-protocol",
    "binary",
    "crates/notifier",
]

# Release builds do full LTO+lld linking; incremental compilation produces
# stale hidden LLVM anon-symbol units that make `rust-lld` fail with
# "undefined hidden symbol: anon...llvm" after editing workspace crates.
# Incremental gives little benefit in release mode, so keep it off there.
[profile.release]
incremental = false

[workspace.dependencies]
# async
tokio       = { version = "1", features = ["full"] }
async-trait = "0.1"
futures     = "0.3"
futures-util = "0.3"

# error handling
anyhow    = "1"
thiserror = "1"

# serde / json
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# redis
fred = { version = "10", features = ["subscriber-client"] }

# http
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }

# tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI / env
dotenvy    = "0.15"

# env config
envconfig = "0.11"

# yaml
serde_yaml = "0.9"

# toml
toml = "0.8"

# regex
regex = "1"

# random
rand = "0.8"

# url parsing
url = "2"

# test utils
tempfile = "3"

# signal / process
nix = { version = "0.29", default-features = false, features = ["signal", "process"] }

# async streams
tokio-stream = "0.1"
