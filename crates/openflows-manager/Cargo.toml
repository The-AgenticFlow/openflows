# Cargo manifest for the OpenFlows Manager service crate.
[package]
name = "openflows-manager"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
config = { version = "0.2.0", path = "../config" }
pocketflow-core = { version = "0.1.0", path = "../pocketflow-core" }
axum = { version = "0.8", features = ["http1", "json"] }
tower-http = { version = "0.6", features = ["trace"] }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
async-trait = { workspace = true }
rand = { workspace = true }
aes-gcm = "0.10"
subtle = "2"
http = "1"
url = { workspace = true }
reqwest = { workspace = true }
jsonwebtoken = { workspace = true }
hmac = "0.12"

[features]
default = []
# Feature-gates the PostgreSQL-backed foundations. The `db` module is always
# compiled; this flag is reserved for any future hosted-only surface and to make
# the integration-test dependencies explicit.
hosted = []

[dev-dependencies]
reqwest = { workspace = true }
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
