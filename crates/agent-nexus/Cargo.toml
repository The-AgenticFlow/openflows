[package]
name = "agent-nexus"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
pocketflow-core = { version = "0.1.0", path = "../pocketflow-core" }
config = { version = "0.2.0", path = "../config" }
github = { version = "0.1.0", path = "../github" }
coder-client = { version = "0.1.0", path = "../coder-client" }
openflows-notifier = { package = "notifier", version = "0.1.0", path = "../notifier" }
a2a-protocol = { version = "0.1.0", path = "../a2a-protocol" }
provisioner = { version = "0.1.0", path = "../provisioner" }

anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# A2A relay HTTP server
axum = { version = "0.8", features = ["http1"] }
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = { workspace = true, features = ["sync"] }
futures = { workspace = true }

# Coder agent lifecycle hooks (experimental) consumer
# 10.3.0+ fixes CVE-2026-25537 / GHSA-h395-gr6q-cpjc (type-confusion auth bypass).
# `rust_crypto` selects the ring-backed crypto provider so HS256 verification
# works without an explicit process-level CryptoProvider::install_default().
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
sha2 = "0.10"
reqwest = { workspace = true }

[dev-dependencies]
mockito = "1"
