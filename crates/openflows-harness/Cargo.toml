[package]
name = "openflows-harness"
version = "1.2.1"
edition = "2021"
license = "MIT"
description = "Typed SharedStore CLI for Coder Agent worker workspaces"

[package.metadata.cargo-machete]
ignored = ["chrono"]

[[bin]]
name = "openflows-harness"
path = "src/main.rs"

[dependencies]
pocketflow-core = { version = "0.1.0", path = "../pocketflow-core" }
a2a-protocol = { version = "0.1.0", path = "../a2a-protocol" }
config = { version = "0.2.0", path = "../config" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
fred = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = "0.4"
reqwest = { workspace = true }
uuid = { version = "1.0", features = ["v4"] }
nix = { workspace = true }
futures = { workspace = true }
sha2 = "0.10"

tempfile = { workspace = true }

[dev-dependencies]
fred = { workspace = true, features = ["i-config"] }
