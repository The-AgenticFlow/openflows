# git-cliff changelog configuration, loaded by release-plz via
# `changelog_config = "cliff.toml"` in `release-plz.toml`.
# See https://git-cliff.org/docs/configuration
#
# Adapted from the sibling project (ador sy status-list-server) to render under
# release-plz's embedded git-cliff-core: the `remote` object (owner/repo/link/
# contributors) is provided by release-plz, not git-cliff's native `github`.

[changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.
<!-- markdownlint-disable line-length no-bare-urls ul-style emphasis-style -->
"""
# template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{%- if not version -%}
## [unreleased]
{% else -%}
## [{{ version | replace(from="openflows-", to="") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% endif -%}

{% macro area(scope) -%}
{%- if scope == "api" -%}API
{%- elif scope == "a2a" -%}A2A
{%- elif scope == "a2a-protocol" -%}A2A
{%- elif scope == "e2e" -%}E2E
{%- elif scope == "tui" -%}TUI
{%- elif scope == "ui" -%}UI
{%- elif scope == "mcp" -%}MCP
{%- elif scope == "github" -%}GitHub
{%- elif scope == "agent-forge" -%}Agent Forge
{%- elif scope == "agent-sentinel" -%}Agent Sentinel
{%- elif scope == "coder-client" -%}Coder Client
{%- elif scope == "pair-harness" -%}Pair Harness
{%- elif scope == "docker-compose" -%}Docker Compose
{%- elif scope == "lifecycle-hooks" -%}Lifecycle Hooks
{%- elif scope == "state-machine" -%}State Machine
{%- elif scope == "model-discovery" -%}Model Discovery
{%- elif scope == "resolve-version" -%}Resolve Version
{%- elif scope == "quick-start" -%}Quick Start
{%- elif scope == "external-auth" -%}External Auth
{%- else -%}{{ scope | replace(from=", ", to=",") | replace(from=",", to=", ") | replace(from="-", to=" ") | upper_first }}
{%- endif -%}
{% endmacro area -%}

{% macro mention(commit) -%}
{%- if commit.author -%}
{%- set acct = commit.author -%}
{%- set email = acct.email -%}
{%- set email_ok = email is string -%}
{%- if email_ok and email is ending_with("@users.noreply.github.com") -%}
(@{{ email | split(pat="+") | last | split(pat="@") | first }})
{%- elif acct.name -%}
(@{{ acct.name }})
{%- endif -%}
{%- endif -%}
{% endmacro mention -%}

{% macro commit(commit) -%}
-{% if commit.scope %} {{ self::area(scope=commit.scope) }}:{% endif %} {{ commit.message | upper_first | trim }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %} {{ self::mention(commit=commit) }}{% if commit.breaking %} [**breaking**]{% endif %}
{%- endmacro commit -%}

{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") %}{{ self::commit(commit=commit) }}
{% endfor %}{% for commit in commits %}{% if not commit.scope %}{{ self::commit(commit=commit) }}
{% endif %}{% endfor %}

{% endfor %}

{% if version %}
{% if previous.version %}
{%- if release_link -%}
**Full Changelog**: {{ release_link }} {# release-plz specific variable #}
{%- else -%}
**Full Changelog**: {{ self::remote_url() }}/compare/{{ previous.version }}...{{ version }}
{% endif %}
{% endif %}
{% else -%}
  {% raw %}\n{% endraw %}
{% endif %}

{%- macro remote_url() -%}
{%- if remote.owner -%} {# release-plz specific variable #}
https://github.com/{{ remote.owner }}/{{ remote.repo }}\
{%- else -%}
https://github.com/The-AgenticFlow/openflows\
{%- endif -%}
{%- endmacro %}
"""
# remove the leading and trailing whitespace from the template
trim = false
# postprocessors for the changelog body
postprocessors = [
  { pattern = ' +\n', replace = "\n" },
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
# render `(#N)` PR trailers as `/pull/N` links so release-plz's contributor
# lookups (`prs_from_text` → `remote.contributors`) can discover the PR number.
# This mirrors release-plz's own default preprocessor (its default is skipped
# whenever this array is non-empty, so we must reproduce the linkification here).
# The `(#N)` trailer is the ONLY recognized PR marker: `(Refs #N)` and `fixes #N`
# refer to issues/work items in this repo, never PRs, so they are left untouched.
commit_preprocessors = [
  { pattern = '\(#([0-9]+)\)', replace = '([#$1](https://github.com/The-AgenticFlow/openflows/pull/$1))' },
]
# regex for parsing and grouping commits
commit_parsers = [
  # release-plz adds 0000000 as a placeholder for release commits
  { field = "id", pattern = "0000000", skip = true },
  # Suppress internal release-tooling and CI-only commits from the user changelog.
  # Any conventional-commit type scoped to (release) or (ci) is infrastructure-only
  # and should not appear as user-facing features/fixes in GitHub Release notes.
  { message = "^[a-zA-Z]+\\(release\\):", skip = true },
  { message = "^[a-zA-Z]+\\(ci\\):",      skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^[fF]ix", group = "<!-- 01 -->Bug fixes" },
  { message = "^docs", group = "<!-- 02 -->Documentation" },
  { message = "^refactor", group = "<!-- 03 -->Code refactoring" },
  { message = "^perf", group = "<!-- 04 -->Performance improvements" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore: release", skip = true },
  { message = "^chore\\(openflows\\): release", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^build\\(deps\\)", skip = true },
  { message = "^build\\(release\\)", skip = true },
  { message = "^build", group = "<!-- 06 -->Build" },
  { message = "^ci", group = "<!-- 07 -->Continuous integration" },
  { message = "^style", group = "<!-- 08 -->Chores" },
  { message = "^[cC]hore", group = "<!-- 08 -->Chores" },
  { message = "^revert", group = "<!-- 09 -->Reverts" },
  { body = ".*security", group = "<!-- 10 -->Security" },
  # Fallback: any conventional type not listed above (e.g. legacy `merge:`,
  # `remove:`, `release:`, `hardening:` commits predating commitlint) is folded
  # into Chores rather than surfacing as its own one-off heading. Placed last
  # so the specific parsers above always take precedence.
  { message = "^[a-zA-Z0-9-]+:", group = "<!-- 08 -->Chores" },
]

# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = true
# filter out the commits that are not matched by commit parsers
filter_commits = false
# glob pattern for matching git tags (release-plz matches versions from its own
# tag template for `openflows`, so this governs which tags get changelog blocks)
tag_pattern = "openflows-[0-9]*"
# regex for ignoring tags completely (no changelog block, no comparison anchor)
# rc, beta, alpha are all treated identically: excluded as if they never existed
ignore_tags = "rc|beta|alpha"
# sort the tags topologically
topo_order = true
# sort the commits inside sections by oldest/newest order
sort_commits = "newest"
