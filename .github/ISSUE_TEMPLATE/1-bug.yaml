name: "🐞 Bug report"
description: "Something is broken or not working as expected."
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        **Found a security vulnerability?** Do not open a public issue. Follow our [security policy](https://github.com/The-AgenticFlow/openflows/security/policy) instead.

  - type: checkboxes
    id: existing_issues
    attributes:
      label: "Is there an existing issue for this?"
      description: "Please search to see if an issue already exists for the bug you encountered."
      options:
        - label: "I have searched the existing issues"
          required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: "What happened?"
      description: "A clear and concise description of the bug."
      placeholder: "Tell us what you see!"
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: "What did you expect to happen?"
      description: "A clear and concise description of what you expected to happen."

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: "Steps to reproduce"
      description: "Provide step-by-step instructions to reproduce the bug."
      placeholder: |
        1. Run `./scripts/setup.sh owner/repo`
        2. Open a GitHub issue on the connected repository
        3. ...
        4. The bug occurs
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Which part of OpenFlows is affected?"
      multiple: true
      options:
        - "NEXUS / Controller"
        - "FORGE"
        - "SENTINEL"
        - "VESSEL"
        - "LORE"
        - "Harness CLI (openflows-harness)"
        - "A2A relay / verification"
        - "Lifecycle hooks"
        - "Coder templates / workspace provisioning"
        - "Manager"
        - "Setup scripts / installation"
        - "Documentation"
        - "Other / not sure"

  - type: dropdown
    id: deployment
    attributes:
      label: "How did you deploy OpenFlows?"
      options:
        - "./scripts/setup.sh (bundled stack)"
        - "docker compose (manual)"
        - "Other / not sure"

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: |
        - **OpenFlows version**: run `openflows --version`
        - **Coder version**: run `coder version` or check `CODER_IMAGE_TAG`
        - **Host OS**: e.g. Ubuntu 24.04, macOS 15
      value: |
        - OpenFlows version:
        - Coder version:
        - Host OS:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant log output"
      description: |
        Paste any relevant logs, such as controller logs or the output of `openflows doctor`. This will be formatted as code automatically, so no need for backticks.

        ⚠️ **Remove all secrets before pasting**: Coder session tokens, GitHub App keys, webhook URLs, and anything from your `.env` file.
      render: shell

  - type: dropdown
    id: additional_info
    attributes:
      label: "Additional context"
      description: "Select any that apply."
      multiple: true
      options:
        - "The bug occurs consistently"
        - "The bug is new (it previously worked fine)"
        - "I have tested this on the latest release"
