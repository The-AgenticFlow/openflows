name: Release Assets

# Builds the cross-platform binary tarballs for a release from its tag, attaches
# them to the draft GitHub Release that release-plz created, then publishes it.
# Published releases are immutable, so this is the only moment files can be added;
# if a build fails the release stays a draft and the run can be retried.
#
# Dispatched by `release.yml`: tags created with GITHUB_TOKEN trigger no workflows.
# Each run bundles all shipped binaries (`openflows`, `openflows-doctor`,
# `openflows-harness`) into one tarball per platform, plus the files
# `setup.sh --binary` needs without a checkout, and calls `template-release.yml` for
# the template bundles. Asset names are fixed:
# `openflows-<version>-<target>.tar.gz(+.sha256)`, `openflows-<version>-setup.tar.gz(+.sha256)`.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish, e.g. 1.2.1 (its draft release must exist)'
        required: true
      wait_for_images:
        description: 'Publish only once its Docker images exist (turn off only to test on a fork)'
        type: boolean
        default: true

concurrency:
  group: release-assets-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zigbuild_target: x86_64-unknown-linux-gnu.2.17
            use_zigbuild: true
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_zigbuild: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            zigbuild_target: aarch64-unknown-linux-gnu.2.17
            use_zigbuild: true
            # Zig runs on the x86-64 runner and cross-compiles.
            zig_url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
            zig_sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
          - os: macos-latest
            target: x86_64-apple-darwin
            use_zigbuild: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_zigbuild: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openflows-${{ inputs.version }}
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          target: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools libssl-dev pkg-config
          if [[ "${{ matrix.target }}" == "aarch64"* ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      # Install the Zig compiler from the official ziglang.org download and
      # verify its SHA-256 against the official digest for this version before
      # using it, and install cargo-zigbuild as a prebuilt binary from GitHub
      # Releases (SHA-256 pinned in the install-action manifest). The toolchain
      # that produces the release artifacts is therefore integrity-checked
      # independently of the checksums generated from those artifacts.
      - name: Install Zig (verified)
        if: matrix.use_zigbuild
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          ARCHIVE="${ZIG_URL##*/}"
          curl -fsSL "$ZIG_URL" -o "$TMP/$ARCHIVE"
          echo "$ZIG_SHA256  $TMP/$ARCHIVE" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf "$TMP/$ARCHIVE" -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
        env:
          ZIG_URL: ${{ matrix.zig_url }}
          ZIG_SHA256: ${{ matrix.zig_sha256 }}

      - name: Install cargo-zigbuild
        if: matrix.use_zigbuild
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-zigbuild@0.23.0

      - name: Build binaries
        run: >
          ${{ matrix.use_zigbuild && 'cargo zigbuild' || 'cargo build' }} --release
          --target ${{ matrix.use_zigbuild && matrix.zigbuild_target || matrix.target }}
          --bin openflows
          --bin openflows-doctor
          --bin openflows-harness

      - name: Create tarball
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Guard against non-version values producing bad asset/tag names.
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '${VERSION}' (expected X.Y.Z)"
            exit 1
          fi
          PLATFORM="${{ matrix.target }}"
          ARCHIVE="openflows-${VERSION}-${PLATFORM}"
          mkdir -p "dist/${ARCHIVE}"

          for bin in openflows openflows-doctor openflows-harness; do
            cp "target/${{ matrix.target }}/release/${bin}" "dist/${ARCHIVE}/"
          done

          tar -czf "dist/${ARCHIVE}.tar.gz" -C dist "${ARCHIVE}"
          cd dist
          shasum -a 256 "${ARCHIVE}.tar.gz" > "${ARCHIVE}.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/*
          retention-days: 5

  # Runs every archive on a machine of its own kind before anything is attached (#526).
  # The checker comes from this workflow's commit, not from the release being checked.
  verify:
    name: Verify (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            run_with: native
          # Alpine has no glibc: the musl programs must run without it.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            run_with: alpine
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            run_with: native
          # Apple Silicon runner; the Intel programs run under Rosetta.
          - os: macos-latest
            target: x86_64-apple-darwin
            run_with: rosetta
          - os: macos-latest
            target: aarch64-apple-darwin
            run_with: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify-release.sh
          sparse-checkout-cone-mode: false

      - name: Download the archive
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: dist/

      - name: Install Rosetta
        if: matrix.run_with == 'rosetta'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license

      - name: Install objdump
        if: runner.os == 'Linux'
        run: command -v objdump >/dev/null || { sudo apt-get update && sudo apt-get install -y binutils; }

      - name: Check the archive and run its programs
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          RUN_WITH: ${{ matrix.run_with }}
        run: >
          bash scripts/verify-release.sh archive
          "dist/openflows-${VERSION}-${TARGET}.tar.gz" "${VERSION}" "${TARGET}"
          --run-with "${RUN_WITH}"

  templates:
    name: Template bundles
    uses: ./.github/workflows/template-release.yml
    permissions:
      contents: write
    with:
      version: ${{ inputs.version }}

  attach:
    name: Attach assets and publish
    runs-on: ubuntu-latest
    needs: [build, templates, verify]
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      TAG: openflows-${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: openflows-${{ inputs.version }}
          persist-credentials: false

      # The checker from this workflow's commit, kept apart from the release's files.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: verifier
          persist-credentials: false
          sparse-checkout: scripts/verify-release.sh
          sparse-checkout-cone-mode: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/
          pattern: binaries-*
          merge-multiple: true

      # What `setup.sh --binary` needs when there is no checkout.
      - name: Create setup kit
        run: |
          set -euo pipefail
          printf '%s\n' "${VERSION}" > RELEASE_VERSION
          tar -czf "dist/${TAG}-setup.tar.gz" --transform "s,^,${TAG}/," \
            RELEASE_VERSION .env.example deploy/local docker-compose*.yml \
            scripts/setup.sh scripts/setup-release.sh scripts/prod.sh scripts/connected-local-github.py
          cd dist
          sha256sum "${TAG}-setup.tar.gz" > "${TAG}-setup.tar.gz.sha256"

      - name: Check the setup kit
        run: bash verifier/scripts/verify-release.sh kit "dist/${TAG}-setup.tar.gz" "${VERSION}"

      - name: Attach to the draft
        run: |
          set -euo pipefail
          if [ "$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "::error::${TAG} is not a draft release; published releases are immutable."
            exit 1
          fi
          # Every target must be present: a published release can't be completed later.
          TARGETS="x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin"
          for target in ${TARGETS}; do
            test -s "dist/${TAG}-${target}.tar.gz"
            test -s "dist/${TAG}-${target}.tar.gz.sha256"
          done
          # GitHub's upload API fails now and then; both commands are safe to repeat.
          for attempt in 1 2 3 4 5; do
            gh release upload "${TAG}" dist/*.tar.gz dist/*.sha256 --repo "${GITHUB_REPOSITORY}" --clobber && break
            [ "${attempt}" -lt 5 ] || exit 1
            sleep 30
          done

      # What users download is what was checked: compare the draft's files with ours.
      - name: Check the uploaded files
        run: |
          set -euo pipefail
          mkdir uploaded
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir uploaded --pattern '*.tar.gz' --pattern '*.sha256'
          for file in dist/*.tar.gz dist/*.sha256; do
            name="${file#dist/}"
            if ! cmp -s "${file}" "uploaded/${name}"; then
              echo "::error::${name} on the draft release differs from the checked file."
              exit 1
            fi
          done
          echo "All $(find dist -maxdepth 1 -type f | wc -l) files on the draft match the checked ones."

      # A published release is installable, and installs need its images. If they never
      # appear the release stays a draft; re-run this job once they exist.
      - name: Wait for the Docker images
        if: inputs.wait_for_images
        env:
          IMAGE_WAIT_SECONDS: 7200
        run: |
          set -euo pipefail
          image_exists() {
            local token
            token="$(curl -fsS "https://ghcr.io/token?scope=repository:${1}:pull" | jq -r .token)" || return 1
            [ "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
              -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/${1}/manifests/${VERSION}")" = 200 ]
          }
          for image in "${GITHUB_REPOSITORY,,}" "${GITHUB_REPOSITORY,,}-manager"; do
            until image_exists "${image}"; do
              if [ "${SECONDS}" -ge "${IMAGE_WAIT_SECONDS}" ]; then
                echo "::error::ghcr.io/${image}:${VERSION} did not appear; ${TAG} stays a draft."
                exit 1
              fi
              sleep 60
            done
          done

      - name: Check the Docker images
        if: inputs.wait_for_images
        run: |
          set -euo pipefail
          TAG_TREE="$(git rev-parse 'HEAD^{tree}')"
          for image in "${GITHUB_REPOSITORY,,}" "${GITHUB_REPOSITORY,,}-manager"; do
            bash verifier/scripts/verify-release.sh image "ghcr.io/${image}" "${VERSION}" "${TAG_TREE}"
          done

      - name: Publish the release
        run: |
          set -euo pipefail
          # Finishing an old draft must not move `latest` back.
          LATEST="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)"
          LATEST="${LATEST#openflows-}"
          MAKE_LATEST=true
          if [ -n "${LATEST}" ] && [ "$(printf '%s\n' "${LATEST}" "${VERSION}" | sort -V | tail -1)" != "${VERSION}" ]; then
            MAKE_LATEST=false
          fi
          for attempt in 1 2 3 4 5; do
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest="${MAKE_LATEST}" && break
            [ "${attempt}" -lt 5 ] || exit 1
            sleep 30
          done
