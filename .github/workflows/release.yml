name: Release

# Auto-releases from Conventional Commits (see release-plz.toml).
#
# Runs ONLY on pushes to `main` (release-only; `develop` is the default branch).
# Two jobs:
#   - `release-plz (release-pr)` : scans Conventional Commits since the last tag,
#     computes the next version (feat→minor, fix→patch, BREAKING CHANGE→major),
#     and opens a `release-plz-*` PR to `main` bumping the manifest + CHANGELOG.
#     You merge that PR; you never type a version.
#   - `release-plz (release)`     : when the push is the merge of a `release-plz-*`
#     PR (release_always = false), creates the single tag + GitHub Release for
#     `openflows` (no `v` prefix: `openflows-<version>`). The `release-assets.yml`
#     workflow then attaches the cross-platform binaries, all built from this one
#     release (including `openflows-doctor` and `openflows-harness`, which are not
#     released as separate packages).
#
# Release flow: only `develop` merges into `main`, which triggers `release-pr`;
# the resulting `release-plz-*` version-bump PR merges back into `main` and
# triggers `release`. The `release-branch.yml` guard enforces this source model.
#
# After the tag + GitHub Release are created, this workflow directly dispatches
# `docker-publish.yml` (via `gh workflow run`, which IS exempt from the
# GITHUB_TOKEN anti-recursion safeguard that suppresses `push: tags` and
# `release` events). This replaces the unreliable `workflow_run` trigger that
# docker-publish previously relied on.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    name: Enforce main branch
    runs-on: ubuntu-latest
    steps:
      - name: Check ref
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "::error::The release workflow must run on 'main'; got '${REF}'. Manual dispatch on another branch would compute release contents from the wrong history."
            exit 1
          fi

  release-plz:
    name: release-plz (release-pr)
    runs-on: ubuntu-latest
    needs: gate
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: release-plz/action@5b353e755cfc29e2efff7365a831d69fef0aaea9 # v0.5.99
        with:
          command: release-pr
          version: "0.3.167"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-plz pre-filters commits by package file path: only commits
      # touching `binary/` (where the `openflows` package lives) are passed to
      # git-cliff for changelog generation. Feature/fix work in `crates/*` is
      # excluded, producing empty changelogs (version bump with no entries).
      # This step regenerates CHANGELOG.md with git-cliff directly so ALL
      # conventional commits across the entire workspace are included.
      - name: Regenerate changelog with git-cliff
        if: success()
        run: |
          # Find the release-plz PR branch (if one was created).
          PR_BRANCH=$(gh pr list --repo "${{ github.repository }}" --state open \
            --json headRefName --jq \
            '.[] | select(.headRefName | startswith("release-plz-")) | .headRefName' \
            | head -1)
          if [ -z "$PR_BRANCH" ]; then
            echo "No release-plz PR found — nothing to regenerate."
            exit 0
          fi

          # Fetch and check out the PR branch.
          git fetch origin "${PR_BRANCH}"
          git checkout "${PR_BRANCH}"

          # Read the bumped version from binary/Cargo.toml.
          VERSION=$(grep '^version' binary/Cargo.toml | head -1 | sed 's/.*= *//' | tr -d '"')

          # Install git-cliff.
          cargo install git-cliff --locked --quiet

          # Regenerate the full changelog with ALL commits since each tag,
          # not just those touching binary/.
          git-cliff --tag "openflows-${VERSION}" --output CHANGELOG.md

          # Insert a Contributors section into the latest version block by
          # collecting all unique `by @username` mentions from that block and
          # listing them in a deduplicated, alphabetically sorted section.
          # Bots (github-actions[bot], AgentFlow, etc.) are excluded.
          python3 - <<'PYEOF'
          import re

          VERSION = "${VERSION}"
          BOTS = {"github-actions[bot]", "AgentFlow", "dependabot[bot]", "dependabot-preview[bot]"}

          with open("CHANGELOG.md") as f:
              content = f.read()

          # Extract the latest version block (from its header to the next ## or EOF).
          pattern = rf"(## \[{re.escape(VERSION)}\].*?)(?=\n## \[|\Z)"
          match = re.search(pattern, content, re.DOTALL)
          if not match:
              raise SystemExit(f"Version section [{VERSION}] not found in CHANGELOG.md")
          block = match.group(1)

          # Collect all `by @username` mentions.
          contributors = sorted({
              m for m in re.findall(r"by @([\w-]+)", block)
              if m not in BOTS
          })
          if not contributors:
              raise SystemExit("No contributors found in the version block")

          # Build the Contributors section.
          contrib_lines = "\n".join(f"- @{c}" for c in contributors)
          contrib_section = f"\n### Contributors\n\n{contrib_lines}\n\n"

          # Insert it right before the **Full Changelog** line (or at the end
          # of the block if there is no compare link).
          insert_pattern = r"(\*\*Full Changelog\*\*)"
          if re.search(insert_pattern, block):
              new_block = re.sub(insert_pattern, contrib_section + r"\1", block, count=1)
          else:
              new_block = block.rstrip() + "\n" + contrib_section

          content = content[:match.start(1)] + new_block + content[match.end(1):]
          with open("CHANGELOG.md", "w") as f:
              f.write(content)
          print(f"Inserted {len(contributors)} contributor(s): {', '.join(contributors)}")
          PYEOF

          # Commit and push the corrected changelog to the PR branch.
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add CHANGELOG.md
          git diff --staged --quiet || \
            git commit -m "chore(changelog): regenerate with git-cliff for complete entries"
          git push origin "${PR_BRANCH}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-plz-release:
    name: release-plz (release)
    runs-on: ubuntu-latest
    needs: [gate, release-plz]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: release-plz/action@5b353e755cfc29e2efff7365a831d69fef0aaea9 # v0.5.99
        with:
          command: release
          version: "0.3.167"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # release-plz generates the GitHub Release body from `{{ changelog }}` in
      # `git_release_body`, which is subject to the same per-package commit
      # pre-filtering that produces empty changelogs. This step extracts the
      # latest version's section from CHANGELOG.md (which was regenerated by
      # git-cliff in the release-pr job) and updates the release body.
      - name: Update release body from CHANGELOG
        if: success()
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            echo "No tag found — skipping."
            exit 0
          fi

          # Verify a GitHub Release exists for this tag.
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "No release for ${TAG} — skipping."
            exit 0
          fi

          # Skip if the release body is already populated.
          BODY=$(gh release view "$TAG" --repo "${{ github.repository }}" \
            --json body --jq '.body // ""')
          if [ -n "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "Release body already populated — skipping."
            exit 0
          fi

          # Extract the latest version section from CHANGELOG.md.
          VERSION="${TAG#openflows-}"
          NOTES=$(python3 -c "
          import re, sys
          version = sys.argv[1]
          with open('CHANGELOG.md') as f:
              content = f.read()
          pattern = rf'(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)'
          match = re.search(pattern, content, re.DOTALL)
          print(match.group(1).strip() if match else '')
          " "$VERSION")

          if [ -n "$NOTES" ]; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTES"
            echo "Updated release body for ${TAG}."
          else
            echo "No changelog section found for version ${VERSION} — skipping."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-docker-publish:
    name: Trigger Docker publish
    runs-on: ubuntu-latest
    needs: [gate, release-plz-release]
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository (history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Dispatch docker-publish for the new release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # release-plz creates exactly one `openflows-X.Y.Z` tag per release
          # run. Select the newest-created tag reachable from HEAD.
          TAG="$(git tag --list 'openflows-*' --sort=-creatordate \
            --format='%(refname:short)' | head -1)"
          if [ -z "${TAG}" ]; then
            echo "::notice::No openflows-* tag found — this push did not create a release. Skipping docker-publish dispatch."
            exit 0
          fi
          VERSION="${TAG#openflows-}"
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::Newest tag '${TAG}' is not an exact openflows-X.Y.Z release tag — skipping."
            exit 0
          fi
          echo "Dispatching docker-publish.yml for version ${VERSION}"
          gh workflow run docker-publish.yml --ref main -f version="${VERSION}"
