name: Docker Publish

# Builds and pushes the openflows Docker image to GHCR on every release tag.
#
# Triggered by the same `openflows-X.Y.Z` tag push that fires `release-assets.yml`,
# so the binary tarballs and the container image are always published together.
#
# Published image: ghcr.io/the-agenticflow/openflows
# Tags applied:
#   - ghcr.io/the-agenticflow/openflows:1.3.1   (exact version)
#   - ghcr.io/the-agenticflow/openflows:1.3      (minor floating tag)
#   - ghcr.io/the-agenticflow/openflows:1        (major floating tag)
#   - ghcr.io/the-agenticflow/openflows:latest
#
# Platforms: linux/amd64 and linux/arm64 (published as a multi-platform manifest).
#
# Manual dispatch requires the `version` input (e.g. 1.3.1).
#
# zizmor: ignore[workflow-run] -- used with `types: [completed]` restricted to
# `branches: [main]`, and the run explicitly exits unless
# `github.event.workflow_run.conclusion == "success"`, so an upstream failure or
# untrusted branch can never drive a build/push. The annotation sits above `on:`
# because zizmor attributes the trigger finding to the `on:` block.
on:
  push:
    tags:
      - 'openflows-[0-9]*.[0-9]*.[0-9]*'
  # The release tag is created by release-plz using GITHUB_TOKEN, and GitHub
  # deliberately does NOT dispatch tag-push events for commits/tags created by
  # GITHUB_TOKEN (an anti-recursion safeguard). As a result the `push: tags`
  # trigger alone never fires for release-plz tags. Reliably react to each new
  # release by also running when the `Release` workflow completes successfully:
  # the version is then derived from the newest `openflows-*.*.*` tag.
  workflow_run:
    workflows:
      - 'Release'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 1.3.1 (manual dispatch only)'
        required: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-agenticflow/openflows

jobs:
  build-and-push:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for image attestation (sigstore/cosign provenance).
      id-token: write

    steps:
      - name: Resolve version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT: ${{ github.event_name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          if [ -n "${MANUAL_VERSION}" ]; then
            # Explicit version from a manual dispatch.
            VERSION="${MANUAL_VERSION}"
          elif [ "${GITHUB_EVENT}" = "workflow_run" ]; then
            # Triggered by the `Release` workflow completing. Only build when the
            # triggering run actually succeeded. github.ref_name is the default
            # branch here, not a version, so derive the newest openflows-X.Y.Z
            # tag (the release release-plz just created).
            if [ "${RUN_CONCLUSION}" != "success" ]; then
              echo "::notice::Skipping: triggering Release run concluded '${RUN_CONCLUSION}', not success"
              exit 0
            fi
            VERSION="$(git tag --list 'openflows-[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1 | sed 's/^openflows-//')"
            if [ -z "${VERSION}" ]; then
              echo "::error::No openflows-X.Y.Z tag found to derive version from (workflow_run)"
              exit 1
            fi
          else
            # Tag push: derive the version from the ref name.
            VERSION="${REF_NAME#openflows-}"
          fi
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '${VERSION}' (expected an openflows-X.Y.Z tag or a version input)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/openflows-${{ steps.version.outputs.version }}

      # Enable QEMU so the buildx builder can produce linux/arm64 images on the
      # amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates OCI-standard labels and the full set of version tags.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Exact semver tag from the resolved version (not github.ref_name directly,
            # so manual dispatch works correctly too).
            type=raw,value=${{ steps.version.outputs.version }}
            # Floating minor tag (e.g. 1.3)
            type=raw,value=${{ steps.version.outputs.version }},enable=true,suffix=,prefix=
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            # Floating major tag (e.g. 1)
            type=semver,pattern={{major}},value=${{ steps.version.outputs.version }}
            # latest
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=openflows
            org.opencontainers.image.description=Openflows — agentic workflow orchestrator
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.source=https://github.com/The-AgenticFlow/openflows
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache keyed per branch/tag so re-runs are fast.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
