name: Docker Publish

# Builds and pushes the openflows Docker image to GHCR on every release tag.
#
# Triggered by the same `openflows-X.Y.Z` tag push that fires `release-assets.yml`,
# so the binary tarballs and the container image are always published together.
#
# Published image: ghcr.io/the-agenticflow/openflows
# Tags applied:
#   - ghcr.io/the-agenticflow/openflows:1.3.1   (exact version)
#   - ghcr.io/the-agenticflow/openflows:1.3      (minor floating tag)
#   - ghcr.io/the-agenticflow/openflows:1        (major floating tag)
#   - ghcr.io/the-agenticflow/openflows:latest
#
# Platforms: linux/amd64 and linux/arm64 (published as a multi-platform manifest).
#
# Manual dispatch requires the `version` input (e.g. 1.3.1).
#
# Security note for the `workflow_run` trigger below: it is used deliberately
# with `types: [completed]` restricted to `branches: [main]`. The `resolve` job
# is gated on `github.event.workflow_run.conclusion == "success"` and only
# resolves a version when the triggering run actually created an
# `openflows-X.Y.Z` tag (newest exact-version tag created within the run's
# [created_at, completed_at] window);
# the `build-and-push` job depends on `resolve` and only runs on a resolved
# version. So an upstream failure or untrusted branch can never drive a
# build/push. This is the file zizmor flags
# as `dangerous-triggers`; the suppression is declared in `.github/zizmor.yml`
# (zizmor's inline comment form does not suppress this rule).
on:
  push:
    tags:
      - 'openflows-[0-9]*.[0-9]*.[0-9]*'
  # The release tag is created by release-plz using GITHUB_TOKEN, and GitHub
  # deliberately does NOT dispatch tag-push events for commits/tags created by
  # GITHUB_TOKEN (an anti-recursion safeguard). As a result the `push: tags`
  # trigger alone never fires for release-plz tags. Reliably react to each new
  # release by also running when the `Release` workflow completes successfully:
  # the version is then derived from the newest `openflows-*.*.*` tag.
  workflow_run:
    workflows:
      - 'Release'
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 1.3.1 (manual dispatch only)'
        required: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-agenticflow/openflows

jobs:
  # Resolves the version to build. Kept as its own job so that a
  # not-applicable trigger (failed/cancelled Release run, or a successful run
  # that did not actually create a release tag) skips cleanly at the job level
  # instead of cascading into a broken downstream build.
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    # Failed/cancelled Release completions are skipped at the job level, so they
    # do not spawn a noisy docker-publish failure.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Resolving a version from git tags requires the repo (and tags) to exist,
      # so this resolution job checks out first. The build job below then
      # re-checks out the exact release tag it resolved.
      - name: Checkout repository (history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT: ${{ github.event_name }}
          WORKFLOW_RUN_CREATED_AT: ${{ github.event.workflow_run.created_at }}
          WORKFLOW_RUN_COMPLETED_AT: ${{ github.event.workflow_run.completed_at }}
        run: |
          if [ -n "${MANUAL_VERSION}" ]; then
            # Explicit version from a manual dispatch.
            VERSION="${MANUAL_VERSION}"
          elif [ "${GITHUB_EVENT}" = "workflow_run" ]; then
            # Triggered by the `Release` workflow completing. github.ref_name is
            # the default branch here, not a version. release-plz creates the
            # `openflows-X.Y.Z` tag during the run, so the tag that THIS release
            # produced is the newest exact-version tag whose creator date falls
            # within the run's window ([created_at, completed_at]). We deliberately
            # do NOT gate on the run's head SHA: `workflow_run.head_sha` can be the
            # `develop` tip (a commit that PREDATES the release commit), so an
            # ancestor relationship is unreliable. The creator-date window is the
            # authoritative signal that this run created the tag; a tagless run
            # (release_always=false, no new tag in the window) is skipped so we
            # never rebuild/republish the previous release.
            RUN_START_EPOCH="$(date -d "${WORKFLOW_RUN_CREATED_AT}" +%s)"
            RUN_END_EPOCH="$(date -d "${WORKFLOW_RUN_COMPLETED_AT}" +%s)"
            VERSION=""
            for t in $(git tag --list 'openflows-*' --sort=-v:refname); do
              # Only exact openflows-X.Y.Z tags are candidates; reject any tag with
              # a suffix (e.g. openflows-1.2.3-beta, openflows-1.2.3.4) up front.
              if ! printf '%s' "${t#openflows-}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                continue
              fi
              tag_epoch="$(git for-each-ref --format='%(creatordate:unix)' "refs/tags/${t}")"
              if [ -n "${tag_epoch}" ] && [ "${tag_epoch}" -ge "${RUN_START_EPOCH}" ] && [ "${tag_epoch}" -le "${RUN_END_EPOCH}" ]; then
                VERSION="${t#openflows-}"
                break
              fi
            done
            if [ -z "${VERSION}" ]; then
              echo "::notice::Skipping: triggering Release run did not create an openflows-X.Y.Z tag"
              exit 0
            fi
          else
            # Tag push: derive the version from the ref name.
            VERSION="${REF_NAME#openflows-}"
          fi
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '${VERSION}' (expected an openflows-X.Y.Z tag or a version input)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push Docker image
    needs: resolve
    # Only build when a version was actually resolved (otherwise the version was
    # empty because the run was skipped or created no release tag).
    if: needs.resolve.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for image attestation (sigstore/cosign provenance).
      id-token: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/openflows-${{ needs.resolve.outputs.version }}
          persist-credentials: false

      # Enable QEMU so the buildx builder can produce linux/arm64 images on the
      # amd64 GitHub-hosted runner.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generates OCI-standard labels and the full set of version tags.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Exact semver tag from the resolved version (not github.ref_name directly,
            # so manual dispatch works correctly too).
            type=raw,value=${{ needs.resolve.outputs.version }}
            # Floating minor tag (e.g. 1.3)
            type=raw,value=${{ needs.resolve.outputs.version }},enable=true,suffix=,prefix=
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.resolve.outputs.version }}
            # Floating major tag (e.g. 1)
            type=semver,pattern={{major}},value=${{ needs.resolve.outputs.version }}
            # latest
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=openflows
            org.opencontainers.image.description=Openflows — agentic workflow orchestrator
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.source=https://github.com/The-AgenticFlow/openflows
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache keyed per branch/tag so re-runs are fast.
          # Use an explicit shared `scope` (type=gha defaults the scope to
          # github.ref, so tag-push/workflow_run/dispatch each got their own
          # cold cache and the expensive multi-arch Rust build recompiled from
          # scratch on every release). A single scope lets every build mode
          # reuse one accumulated cache.
          cache-from: type=gha,scope=openflows-docker
          cache-to: type=gha,mode=max,scope=openflows-docker
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
