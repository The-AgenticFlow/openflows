name: Docker Publish

# Builds and pushes the openflows Docker image to GHCR on every release.
#
# The release tag is created by release-plz using GITHUB_TOKEN, and GitHub
# deliberately does NOT dispatch tag-push events for tags created by
# GITHUB_TOKEN (an anti-recursion safeguard). So `push: tags` alone never fires
# for release-plz tags. Instead, the `Release` workflow directly dispatches this
# workflow via `gh workflow run` (workflow_dispatch IS exempt from the safeguard)
# after release-plz creates the tag, passing the exact version.
#
# Published image: ghcr.io/the-agenticflow/openflows
# Tags applied (by the merge job):
#   - ghcr.io/the-agenticflow/openflows:1.3.1   (exact version)
#   - ghcr.io/the-agenticflow/openflows:1.3      (minor floating tag)
#   - ghcr.io/the-agenticflow/openflows:1        (major floating tag)
#   - ghcr.io/the-agenticflow/openflows:latest
#
# Platforms: linux/amd64 and linux/arm64. Each platform is built on a NATIVE
# runner (no QEMU emulation) and pushed with a per-arch tag, then a merge job
# assembles the multi-platform manifest with `docker buildx imagetools create`.
# This avoids QEMU-emulated Rust compilation, which previously took ~1 hour.
#
# Manual dispatch requires the `version` input (e.g. 1.3.1).
on:
  push:
    tags:
      - 'openflows-[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and push, e.g. 1.3.1 (manual dispatch only)'
        required: true

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: the-agenticflow/openflows

jobs:
  # Resolves the version to build. Kept as its own job so that a not-applicable
  # trigger (e.g. a manually-pushed tag that doesn't match the openflows-X.Y.Z
  # pattern) fails at the job level instead of cascading into a broken build.
  resolve:
    name: Resolve release version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository (history + tags)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve version
        id: version
        env:
          MANUAL_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL_VERSION}" ]; then
            # Explicit version from a manual dispatch (or from the Release
            # workflow's `gh workflow run -f version=…` call).
            VERSION="${MANUAL_VERSION}"
          else
            # Tag push: derive the version from the ref name.
            VERSION="${REF_NAME#openflows-}"
          fi
          if ! printf '%s' "${VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '${VERSION}' (expected an openflows-X.Y.Z tag or a version input)"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: resolve
    if: needs.resolve.outputs.version != ''
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          # Native ARM64 runner — no QEMU emulation. This is what eliminates the
          # ~1 hour build time (QEMU-emulated Rust compilation was the bottleneck).
          # Requires the repository to have access to GitHub-hosted ARM runners
          # (free for public repos; available for private repos on paid plans).
          # If unavailable, fall back to `ubuntu-latest` with QEMU (add the
          # `docker/setup-qemu-action` step), but expect ~10x slower arm64 builds.
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/openflows-${{ needs.resolve.outputs.version }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Per-arch tag (e.g. 1.3.1-amd64). The merge job assembles the final
          # multi-platform manifest under the canonical tags.
          tags: |
            type=raw,value=${{ needs.resolve.outputs.version }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.title=openflows
            org.opencontainers.image.description=Openflows — agentic workflow orchestrator
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            org.opencontainers.image.source=https://github.com/The-AgenticFlow/openflows
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch cache scope so the two platforms don't evict each other's
          # layers. Both jobs run in parallel on native runners, so the total
          # wall-clock time is max(amd64, arm64) instead of amd64 + QEMU(arm64).
          cache-from: type=gha,scope=openflows-docker-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=openflows-docker-${{ matrix.arch }}
          provenance: false
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}

  merge:
    name: Merge multi-platform manifest
    needs: [resolve, build]
    if: needs.resolve.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create multi-platform manifest
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          MAJOR="$(printf '%s' "${VERSION}" | cut -d. -f1)"
          MINOR="$(printf '%s' "${VERSION}" | cut -d. -f2)"
          # Assemble the multi-arch manifest from the two per-arch images,
          # tagging it with the canonical version, floating, and latest tags.
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}" \
            -t "${IMAGE}:${MAJOR}.${MINOR}" \
            -t "${IMAGE}:${MAJOR}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${VERSION}-amd64" \
            "${IMAGE}:${VERSION}-arm64"
          echo "Merged multi-platform manifest for ${VERSION}"
