name: Template Release Assets

# Builds the template bundles and attaches them to a draft release. `release-assets.yml`
# calls this before publishing, since published releases are immutable.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      wait_for_images:
        description: 'Pin the workspace image published for this version (turn off only to test on a fork)'
        type: boolean
        default: true
      workspace_runtime_release:
        description: 'Optional workspace-runtime release tag to pin (defaults to latest release)'
        type: string
        required: false
        default: ''
      allow_candidate_runtime:
        description: 'Allow candidate workspace-runtime manifests when pinning template assets'
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the draft release, for example 1.9.0'
        required: true
      wait_for_images:
        description: 'Pin the workspace image published for this version (turn off only to test on a fork)'
        type: boolean
        default: true
      workspace_runtime_release:
        description: 'Optional workspace-runtime release tag to pin (defaults to latest release)'
        type: string
        required: false
        default: ''
      allow_candidate_runtime:
        description: 'Allow candidate workspace-runtime manifests when pinning template assets'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: openflows-${{ inputs.version }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Resolve version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=openflows-$VERSION" >> "$GITHUB_OUTPUT"

      # The manifest pins the workspace-runtime release images for this version:
      # per-role repositories, digests, platform and runtime release. Hosted
      # workspaces run exactly those images.
      - name: Resolve the workspace-runtime manifest
        if: inputs.wait_for_images
        env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE_RUNTIME_RELEASE: ${{ inputs.workspace_runtime_release }}
          ALLOW_CANDIDATE_RUNTIME: ${{ inputs.allow_candidate_runtime }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          REPOSITORY="ghcr.io/${OWNER,,}/workspace-runtime"
          # Hosted workspaces run "<workspace_image_repository>@<digest>", where the
          # repository is the templates' default and only the digest comes from the
          # Manager. A digest of another repository cannot be pulled, so the
          # repository pinned here must match the templates' per-role defaults.
          bash scripts/check-template-image-repository.sh crates/coder-client/templates "${REPOSITORY}"
          RUNTIME_REPO="${OWNER}/workspace-runtime"
          MANIFEST_PATH="${RUNNER_TEMP}/workspace-runtime-release-manifest.json"
          if [ -n "${WORKSPACE_RUNTIME_RELEASE}" ]; then
            gh release download "${WORKSPACE_RUNTIME_RELEASE}" --repo "${RUNTIME_REPO}" --pattern release-manifest.json --output "${MANIFEST_PATH}"
          else
            gh release download --repo "${RUNTIME_REPO}" --pattern release-manifest.json --output "${MANIFEST_PATH}"
          fi
          RUNTIME_VERSION="$(jq -er '.runtime_version' "${MANIFEST_PATH}")"
          RUNTIME_STATUS="$(jq -er '.status' "${MANIFEST_PATH}")"
          if [ "${RUNTIME_STATUS}" = "candidate" ] && [ "${ALLOW_CANDIDATE_RUNTIME}" != "true" ]; then
            echo "::error::workspace-runtime ${RUNTIME_VERSION} has status 'candidate'; pass allow_candidate_runtime=true or pin a compatible workspace_runtime_release"
            exit 1
          fi
          MANIFEST_SHA256="$(sha256sum "${MANIFEST_PATH}" | awk '{print $1}')"
          {
            echo "OPENFLOWS_WORKSPACE_RUNTIME_MANIFEST=${MANIFEST_PATH}"
            echo "OPENFLOWS_WORKSPACE_RUNTIME_MANIFEST_SHA256=${MANIFEST_SHA256}"
            echo "OPENFLOWS_WORKSPACE_ARCH=amd64"
            echo "OPENFLOWS_WORKSPACE_RUNTIME_RELEASE=${RUNTIME_VERSION}"
            if [ "${ALLOW_CANDIDATE_RUNTIME}" = "true" ]; then
              echo "OPENFLOWS_WORKSPACE_RUNTIME_ALLOW_CANDIDATE=true"
            fi
          } >> "$GITHUB_ENV"
          echo "Pinned workspace-runtime manifest ${MANIFEST_SHA256} from ${RUNTIME_REPO} (linux/amd64, runtime ${RUNTIME_VERSION}, status ${RUNTIME_STATUS})"

      - name: Build deterministic template release
        run: |
          cargo run -p openflows-manager --bin build-template-release -- \
            crates/coder-client/templates \
            "${{ steps.release.outputs.version }}" \
            dist/templates

      - name: Upload template assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${TAG}" dist/templates/* --repo "${GITHUB_REPOSITORY}" --clobber
