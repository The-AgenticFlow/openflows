name: Template Release Assets

# Builds the template bundles and attaches them to a draft release. `release-assets.yml`
# calls this before publishing, since published releases are immutable.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      wait_for_images:
        description: 'Pin the workspace image published for this version (turn off only to test on a fork)'
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the draft release, for example 1.9.0'
        required: true
      wait_for_images:
        description: 'Pin the workspace image published for this version (turn off only to test on a fork)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: openflows-${{ inputs.version }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Resolve version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=openflows-$VERSION" >> "$GITHUB_OUTPUT"

      # The manifest pins the workspace image docker-publish.yml builds for this
      # version: its repository, digest, platform and runtime release. Hosted
      # workspaces run exactly that image.
      - name: Resolve the workspace image
        if: inputs.wait_for_images
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_WAIT_SECONDS: 7200
        run: |
          set -euo pipefail
          REPOSITORY="ghcr.io/${GITHUB_REPOSITORY,,}-workspace"
          # Hosted workspaces run "<workspace_image_repository>@<digest>", where the
          # repository is the templates' default and only the digest comes from the
          # Manager. A digest of another repository cannot be pulled, so the
          # repository pinned here must be the one the templates name.
          bash scripts/check-template-image-repository.sh crates/coder-client/templates "${REPOSITORY}"
          until DIGEST="$(docker buildx imagetools inspect "${REPOSITORY}:${VERSION}" --format '{{json .Manifest.Digest}}' 2>/dev/null | tr -d '"')" \
              && [ -n "${DIGEST}" ]; do
            if [ "${SECONDS}" -ge "${IMAGE_WAIT_SECONDS}" ]; then
              echo "::error::${REPOSITORY}:${VERSION} did not appear; the templates cannot pin a workspace image."
              exit 1
            fi
            sleep 60
          done
          if ! printf '%s' "${DIGEST}" | grep -qE '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Could not resolve an immutable digest for ${REPOSITORY}:${VERSION}: '${DIGEST}'"
            exit 1
          fi
          {
            echo "OPENFLOWS_WORKSPACE_IMAGE_REPO=${REPOSITORY}"
            echo "OPENFLOWS_WORKSPACE_IMAGE_DIGEST=${DIGEST}"
            echo "OPENFLOWS_WORKSPACE_ARCH=amd64"
            echo "OPENFLOWS_WORKSPACE_RUNTIME_RELEASE=$(cat runtime/VERSION)"
          } >> "$GITHUB_ENV"
          echo "Pinned ${REPOSITORY}@${DIGEST} (linux/amd64, runtime $(cat runtime/VERSION))"

      - name: Build deterministic template release
        run: |
          cargo run -p openflows-manager --bin build-template-release -- \
            crates/coder-client/templates \
            "${{ steps.release.outputs.version }}" \
            dist/templates

      - name: Upload template assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${TAG}" dist/templates/* --repo "${GITHUB_REPOSITORY}" --clobber
