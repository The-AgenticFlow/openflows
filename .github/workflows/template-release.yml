name: Template Release Assets

# Builds the template bundles and attaches them to a draft release. `release-assets.yml`
# calls this before publishing, since published releases are immutable.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the draft release, for example 1.9.0'
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: openflows-${{ inputs.version }}

      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1

      - name: Resolve version
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid release version '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=openflows-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build deterministic template release
        run: |
          docker pull codercom/enterprise-base:ubuntu
          IMAGE_REFERENCE="$(docker image inspect --format '{{index .RepoDigests 0}}' codercom/enterprise-base:ubuntu)"
          OPENFLOWS_WORKSPACE_IMAGE_DIGEST="${IMAGE_REFERENCE#*@}"
          if ! printf '%s' "$OPENFLOWS_WORKSPACE_IMAGE_DIGEST" | grep -qE '^sha256:[0-9a-fA-F]{64}$'; then
            echo "::error::Could not resolve an immutable workspace image digest"
            exit 1
          fi
          export OPENFLOWS_WORKSPACE_IMAGE_DIGEST
          cargo run -p openflows-manager --bin build-template-release -- \
            crates/coder-client/templates \
            "${{ steps.release.outputs.version }}" \
            dist/templates

      - name: Upload template assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${TAG}" dist/templates/* --repo "${GITHUB_REPOSITORY}" --clobber
