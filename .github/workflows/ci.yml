name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          inputs: .github/workflows
          collect: workflows
          online-audits: false
          version: 1.29.0
          min-severity: high
          min-confidence: medium
          advanced-security: false
          annotations: true

  cargo-fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: rustfmt
      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  cargo-clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          components: clippy
      - name: Run cargo clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  cargo-build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Build workspace
        run: cargo build --locked --workspace --all-targets --all-features

  cargo-test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@9e3720000324bf314ab081346108fc3bab8d6b74 # nextest
      - name: Run tests
        run: cargo nextest run --locked --workspace --all-targets --all-features

  manager-postgres:
    name: Manager PostgreSQL integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: openflows
          POSTGRES_PASSWORD: openflows
          POSTGRES_DB: openflows_control_plane
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openflows -d openflows_control_plane"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      OPENFLOWS_TEST_DATABASE_URL: postgres://openflows:openflows@localhost:5432/openflows_control_plane
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run database and health tests
        run: bash crates/openflows-manager/scripts/run-integration-tests.sh

  cargo-doc:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run cargo doc
        run: cargo doc --locked --workspace --no-deps --all-features

  cargo-machete:
    name: Unused Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install cargo-machete
        uses: taiki-e/install-action@a204b1f75fac0deb6de48efce012ceb27c911814 # cargo-machete
      - name: Run cargo-machete
        run: cargo-machete

  # The former shell-tests job that ran tests/ci/resolve-version-test.sh was
  # removed along with the unused docker version resolver (see PR #358).

  typos:
    name: Spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check for typos
        uses: crate-ci/typos@5e38bf262baaf477ca9f241b3a7cd3d277fd7df8 # master

  redis-lifecycle:
    name: Redis lifecycle integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Run lifecycle tests against disposable Redis
        run: bash tests/integration/gated_workflow_test.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: redis-lifecycle
          path: target/ci-artifacts/redis/
          if-no-files-found: error

  coder-e2e:
    name: Coder container E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Provision and exercise a real worker
        run: bash tests/e2e/run.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coder-e2e
          path: target/ci-artifacts/coder/
          if-no-files-found: error

  delegated-verification:
    name: Delegated verification container E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Verify candidate code through separate real workers
        env:
          OPENFLOWS_E2E_SUITE: verification
        run: bash tests/e2e/run.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: delegated-verification
          path: target/ci-artifacts/delegated-verification/
          if-no-files-found: error

  system-fixtures:
    name: System E2E fixture contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
      - name: Exercise model, GitHub, Git, and independent acceptance contracts
        run: bash tests/e2e/system/run.sh
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: system-fixtures
          path: target/ci-artifacts/system-fixtures/
          if-no-files-found: error

  merge-gate:
    name: OpenFlows Merge Gate
    if: always()
    needs:
      - zizmor
      - cargo-fmt
      - cargo-clippy
      - cargo-build
      - cargo-test
      - manager-postgres
      - cargo-doc
      - cargo-machete
      - typos
      - redis-lifecycle
      - coder-e2e
      - delegated-verification
      - system-fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every mandatory job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json, os, sys
          results = json.loads(os.environ["RESULTS"])
          failures = {name: job["result"] for name, job in results.items()
                      if job["result"] != "success"}
          for name, result in failures.items():
              print(f"{name}: {result}")
          sys.exit(bool(failures) or not results)
          PYTHON
