# zizmor configuration.
#
# `docker-publish.yml` previously used a `workflow_run` trigger (flagged by
# zizmor as `dangerous-triggers`) to react to the Release workflow completing.
# That trigger has been replaced with a direct `workflow_dispatch` call from
# `release.yml` (via `gh workflow run`), which is reliable and exempt from the
# GITHUB_TOKEN anti-recursion safeguard. The suppression below is no longer
# needed but is kept as a no-op in case the trigger is reintroduced.
rules:
  dangerous-triggers:
    ignore: []
