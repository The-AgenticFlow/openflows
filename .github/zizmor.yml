# zizmor configuration.
#
# `docker-publish.yml` intentionally uses a `workflow_run` trigger to react to
# the `Release` workflow completing (the release tag is created by release-plz
# using GITHUB_TOKEN, which GitHub does not emit a tag-push event for). zizmor
# flags ANY `workflow_run` under `dangerous-triggers` regardless of guardrails,
# and its inline-comment suppression does not cover this rule. The trigger is
# safe here:
#
#   - restricted to `types: [completed]` and `branches: [main]`
#   - the `resolve` job is gated on `github.event.workflow_run.conclusion == "success"`
#   - a version is resolved only when the triggering run points at an
#     `openflows-X.Y.Z` tag, and the `build-and-push` job only runs on a
#     resolved version — so an upstream failure or untrusted branch can never
#     drive a build/push
rules:
  dangerous-triggers:
    ignore:
      - "docker-publish.yml"
