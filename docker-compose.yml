name: openflows

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  coder-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:-coder}
      POSTGRES_DB: coder
    volumes:
      - coder_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  coder:
    image: ghcr.io/coder/coder:${CODER_IMAGE_TAG:-v2.37.1}
    user: "0:0"
    ports:
      - "${CODER_PORT:-7080}:${CODER_INTERNAL_PORT:-7080}"
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:${CODER_PG_PASSWORD:-coder}@coder-db:5432/coder?sslmode=disable
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://localhost:${CODER_PORT:-7080}}
      CODER_HTTP_ADDRESS: "0.0.0.0:${CODER_INTERNAL_PORT:-7080}"
      CODER_PROVISIONER_DAEMONS: "1"
      CODER_PROVISIONER_DAEMON_TYPE: "docker"
      DOCKER_HOST: unix:///var/run/docker.sock
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379}
      CODER_URL: ${CODER_URL:-http://localhost:${CODER_PORT:-7080}}
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: ${CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS:-true}
      # GitHub external auth (Git App) — OPTIONAL. Lets agents push/pull against
      # PRIVATE repos. Disabled by default because it crashes `coder server` when
      # client_id/client_secret are empty. To enable: uncomment the block below and
      # set the credentials (create a GitHub App, callback URL
      # ${CODER_ACCESS_URL}/external-auth/primary-github/callback).
      CODER_EXTERNAL_AUTH_0_ID: ${CODER_EXTERNAL_AUTH_0_ID:-primary-github}
      CODER_EXTERNAL_AUTH_0_TYPE: ${CODER_EXTERNAL_AUTH_0_TYPE:-github}
      CODER_EXTERNAL_AUTH_0_CLIENT_ID: ${CODER_EXTERNAL_AUTH_0_CLIENT_ID:-}
      CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: ${CODER_EXTERNAL_AUTH_0_CLIENT_SECRET:-}
      CODER_EXTERNAL_AUTH_0_SCOPES: ${CODER_EXTERNAL_AUTH_0_SCOPES:-repo}
      CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL: ${CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL:-}
      # Agent lifecycle hooks — Coder POSTs JWT-signed lifecycle events to the
      # OpenFlows hook consumer. The hook URL is an internal detail: compose
      # derives it from OPENFLOWS_HOOK_PORT and the internal host label Coder
      # uses to reach the host (host.docker.internal). Operators set only the
      # port, secret, and (dev) allow-insecure switch — never the raw URL.
      CODER_EXPERIMENTS: ${CODER_EXPERIMENTS:-}
      CODER_CHAT_HOOK_URL: "http://host.docker.internal:${OPENFLOWS_HOOK_PORT:-3001}/experimental/hooks/chat"
      CODER_CHAT_HOOK_SECRET: ${CODER_CHAT_HOOK_SECRET:-}
      # Dev-only: allow the plain-http hook URL above. Remove in production.
      CODER_CHAT_HOOK_ALLOW_INSECURE: ${CODER_CHAT_HOOK_ALLOW_INSECURE:-false}
    extra_hosts:
      # Make the host reachable from inside the container so Coder can POST to
      # the OpenFlows lifecycle hook consumer running on the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # TEMPORARY: Mount local openflows binary for testing (remove when using GitHub releases)
      - ./.dev-binaries:/opt/openflows-dev:ro
    depends_on:
      coder-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CODER_INTERNAL_PORT:-7080}/api/v2/buildinfo"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  redis_data:
  coder_db_data:
