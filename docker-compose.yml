name: openflows

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

  coder-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${CODER_PG_PASSWORD:-coder}
      POSTGRES_DB: coder
    volumes:
      - coder_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Openflows control-plane PostgreSQL. This is a separate database and role
  # from Coder's `coder-db`; the Manager owns and migrates it. Kept out of the
  # default `up` set because hosted mode is not enabled by default, but available
  # for local development of the manager foundations (WP-01) and integration
  # tests. Bind to a dedicated host port so it never collides with coder-db.
  openflows-db:
    image: postgres:16-alpine
    profiles: ["manager"]
    environment:
      POSTGRES_USER: openflows
      POSTGRES_PASSWORD: ${OPENFLOWS_PG_PASSWORD:-openflows}
      POSTGRES_DB: openflows_control_plane
    ports:
      - "${OPENFLOWS_PG_BIND_ADDRESS:-127.0.0.1}:${OPENFLOWS_PG_PORT:-5544}:5432"
    volumes:
      - openflows_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openflows"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Copies the released OpenFlows programs out of the published image into
  # ./.dev-binaries, the folder Coder workspaces read them from. Runs only with
  # `--profile images`; the source install fills the same folder by compiling.
  # Create ./.dev-binaries first so it stays owned by your user.
  openflows-binaries:
    image: ghcr.io/the-agenticflow/openflows:${OPENFLOWS_VERSION:-latest}${OPENFLOWS_IMAGE_DIGEST:+@${OPENFLOWS_IMAGE_DIGEST}}
    profiles: ["images"]
    user: "${OPENFLOWS_HOST_UID:-1000}:${OPENFLOWS_HOST_GID:-1000}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if ! touch /out/.write-test 2>/dev/null; then
          echo "Cannot write to .dev-binaries as user $$(id -u):$$(id -g)." >&2
          echo "Set OPENFLOWS_HOST_UID / OPENFLOWS_HOST_GID in .env to the output of 'id -u' / 'id -g'" >&2
          echo "(and create .dev-binaries yourself), or run ./scripts/setup.sh --compose." >&2
          exit 1
        fi
        rm -f /out/.write-test
        for bin in openflows openflows-doctor openflows-harness; do
          cp "/usr/local/bin/$$bin" "/out/$$bin.tmp"
          chmod 0755 "/out/$$bin.tmp"
          mv "/out/$$bin.tmp" "/out/$$bin"
        done
        printf '%s\n' "$$OPENFLOWS_IMAGE_REF" > /out/IMAGE
        echo "Installed OpenFlows programs from $$OPENFLOWS_IMAGE_REF"
    environment:
      OPENFLOWS_IMAGE_REF: ghcr.io/the-agenticflow/openflows:${OPENFLOWS_VERSION:-latest}${OPENFLOWS_IMAGE_DIGEST:+@${OPENFLOWS_IMAGE_DIGEST}}
    volumes:
      - ./.dev-binaries:/out
    restart: "no"

  coder:
    image: ghcr.io/coder/coder:${CODER_IMAGE_TAG:-v2.37.3}
    user: "0:0"
    ports:
      - "${CODER_PORT:-7080}:${CODER_INTERNAL_PORT:-7080}"
    environment:
      CODER_PG_CONNECTION_URL: postgres://coder:${CODER_PG_PASSWORD:-coder}@coder-db:5432/coder?sslmode=disable
      CODER_ACCESS_URL: ${CODER_ACCESS_URL:-http://localhost:${CODER_PORT:-7080}}
      CODER_HTTP_ADDRESS: "0.0.0.0:${CODER_INTERNAL_PORT:-7080}"
      CODER_PROVISIONER_DAEMONS: "1"
      CODER_PROVISIONER_DAEMON_TYPE: "docker"
      # Shared Terraform provider cache so workspace builds reuse downloaded
      # providers instead of re-fetching them from GitHub on every build (which
      # intermittently 504s). Persisted on the tf_plugin_cache volume.
      TF_PLUGIN_CACHE_DIR: /root/.terraform.d/plugin-cache
      DOCKER_HOST: unix:///var/run/docker.sock
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      CODER_URL: ${CODER_URL:-http://localhost:${CODER_PORT:-7080}}
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: ${CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS:-true}
      CODER_OAUTH2_GITHUB_CLIENT_ID: ${CODER_OAUTH2_GITHUB_CLIENT_ID:-}
      CODER_OAUTH2_GITHUB_CLIENT_SECRET: ${CODER_OAUTH2_GITHUB_CLIENT_SECRET:-}
      CODER_OAUTH2_GITHUB_ALLOWED_ORGS: ${CODER_OAUTH2_GITHUB_ALLOWED_ORGS:-}
      CODER_OAUTH2_GITHUB_ALLOW_EVERYONE: ${CODER_OAUTH2_GITHUB_ALLOW_EVERYONE:-false}
      CODER_OAUTH2_PROVIDER_ENABLE: ${CODER_OAUTH2_PROVIDER_ENABLE:-false}
      # GitHub external auth (Git App) — lets agents push/pull against PRIVATE
      # repos via OIDC. Values come from .env (see quick_start.md Step 2).
      # IMPORTANT: `coder server` fails to start if client_id/client_secret are
      # EMPTY, so these MUST be populated in .env BEFORE `docker compose up -d`.
      # A fresh setup is covered by `.env.example` (which ships these populated
      # with placeholders) + quick_start Step 2. If your existing `.env` predates
      # this block, add the CODER_EXTERNAL_AUTH_0_* vars (or start from
      # `.env.example`) or Coder will not come up.
      # Callback URL: ${CODER_ACCESS_URL}/external-auth/primary-github/callback
      CODER_EXTERNAL_AUTH_0_ID: ${CODER_EXTERNAL_AUTH_0_ID:-primary-github}
      CODER_EXTERNAL_AUTH_0_TYPE: ${CODER_EXTERNAL_AUTH_0_TYPE:-github}
      CODER_EXTERNAL_AUTH_0_CLIENT_ID: ${CODER_EXTERNAL_AUTH_0_CLIENT_ID:-}
      CODER_EXTERNAL_AUTH_0_CLIENT_SECRET: ${CODER_EXTERNAL_AUTH_0_CLIENT_SECRET:-}
      CODER_EXTERNAL_AUTH_0_SCOPES: ${CODER_EXTERNAL_AUTH_0_SCOPES:-repo}
      CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL: ${CODER_EXTERNAL_AUTH_0_APP_INSTALL_URL:-}
      # Agent lifecycle hooks are wired by OpenFlows. Operators do not need to
      # configure Coder's raw hook URL/experiment flags for the bundled stack.
      # OPENFLOWS_HOOK_URL is the single source of truth for the hook endpoint:
      # it is forwarded to Coder (here) and to the Nexus consumer via bootstrap,
      # so Coder's CODER_CHAT_HOOK_URL and the consumer's expected JWT `aud`
      # stay in lockstep (prevents hook JWT InvalidAudience failures).
      CODER_EXPERIMENTS: ${CODER_EXPERIMENTS:-agent-lifecycle-hooks}
      # OpenFlows controllers use long-lived local service tokens. Hosted mode
      # will replace this with brokered, renewable credentials.
      CODER_MAX_TOKEN_LIFETIME: ${CODER_MAX_TOKEN_LIFETIME:-2160h}
      # The Manager is normally owned by a Coder administrator. Coder applies
      # a separate, seven-day default maximum to administrator API keys.
      CODER_MAX_ADMIN_TOKEN_LIFETIME: ${CODER_MAX_ADMIN_TOKEN_LIFETIME:-2160h}
      CODER_DEFAULT_TOKEN_LIFETIME: ${CODER_DEFAULT_TOKEN_LIFETIME:-2160h}
      CODER_CHAT_HOOK_URL: ${OPENFLOWS_HOOK_URL:-http://openflows-nexus:3001/experimental/hooks/chat}
      CODER_CHAT_HOOK_SECRET: ${CODER_CHAT_HOOK_SECRET:?Set CODER_CHAT_HOOK_SECRET to 32+ random bytes before enabling lifecycle hooks}
      # Dev-only: allow the plain-http hook URL above.
      CODER_CHAT_HOOK_ALLOW_INSECURE: ${CODER_CHAT_HOOK_ALLOW_INSECURE:-true}
    extra_hosts:
      # Keep host-gateway available for local integrations that need the host.
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # OpenFlows programs: compiled locally, or copied from the published
      # image by the openflows-binaries service (`--profile images`).
      - ./.dev-binaries:/opt/openflows-dev:ro
      # Persist the Terraform provider cache across restarts.
      - tf_plugin_cache:/root/.terraform.d/plugin-cache
    depends_on:
      coder-db:
        condition: service_healthy
      openflows-binaries:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${CODER_INTERNAL_PORT:-7080}/api/v2/buildinfo"]
      interval: 5s
      timeout: 3s
      retries: 15
    restart: unless-stopped

  # Host-run Manager -> tenant Nexus hook servers on the Docker network.
  runtime-relay:
    image: nginx:1.28-alpine
    user: "101:101"
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports: ["127.0.0.1:7081:8080"]
    volumes:
      - ./deploy/local/runtime-relay.conf:/etc/nginx/nginx.conf:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  coder_db_data:
  tf_plugin_cache:
  openflows_db_data:
